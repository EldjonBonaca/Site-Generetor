# nginx site for the Site Generator. Copy to /etc/nginx/sites-available/site-generator,
# replace generator.example.com with your (sub)domain, then enable it and run certbot for HTTPS.
server {
    listen 80;
    server_name generator.example.com;

    # Template kits can be up to MAX_KIT_MB (150 MB by default)
    client_max_body_size 160M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exports and big uploads can take a while
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
